name: Build FlyReq Image Studio image for server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      architecture:
        description: Match uname -m on the server
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Resolve source revision and image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          short_revision=${revision:0:12}
          version=$(node -p "require('./package.json').version")
          image="ghcr.io/${REPOSITORY,,}"
          tag="sha-${short_revision}-${TARGET_ARCH}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          {
            printf 'revision=%s\n' "$revision"
            printf 'version=%s+%s\n' "$version" "$short_revision"
            printf 'image=%s\n' "$image"
            printf 'tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ inputs.architecture }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=flyreq-image-studio-${{ inputs.architecture }}
          cache-to: type=gha,scope=flyreq-image-studio-${{ inputs.architecture }},mode=max

      - name: Show the server deployment command
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo '## Image ready for manual deployment'
            printf 'Source revision: `%s`\n\n' "$REVISION"
            printf 'Image tag: `%s:%s`\n\n' "$IMAGE" "$TAG"
            echo '```bash'
            printf "bash deploy-image.sh deploy '%s@%s'\n" "$IMAGE" "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
